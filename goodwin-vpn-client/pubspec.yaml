name: goodwin_vpn_client
description: "GoodWin VPN Flutter client (Xray / Hysteria / TrustTunnel)."
publish_to: 'none'

version: 1.0.7+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  go_router: 17.3.0
  goodwin_vpn_core:
    path: ../goodwin-vpn-core/packages/goodwin_vpn_core
  vpn_plugin:
    path: ../refs/trusttunnel-client/plugins/vpn_plugin
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  file_picker: ^12.3.0
  mobile_scanner: ^7.4.1
  app_links: ^7.2.1
  pointycastle: ^4.0.0
  flutter_secure_storage: ^11.1.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
